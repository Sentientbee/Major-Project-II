version: '3.8'

services:
  # ----------------------------------------
  # PostgreSQL: Primary Database
  # ----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: workspace_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: workspace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ----------------------------------------
  # Redis: Cache & Rate Limiting
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: workspace_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ----------------------------------------
  # RabbitMQ: Message Broker for Celery
  # ----------------------------------------
  rabbitmq:
    # We use the 'management' tag to get the web UI for easy debugging
    image: rabbitmq:3-management-alpine
    container_name: workspace_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # The actual message broker port
      - "15672:15672"  # The Web Dashboard port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
# -------------------------------------------------------------------------------------------


# ----------------------------------------
  # Django: Core Product Backend
  # ----------------------------------------
  backend:
    build:
      context: ./backend-django
    container_name: workspace_django
    ports:
      - "8000:8000"
    volumes:
      # This syncs your local folder to the container so you get hot-reloading!
      - ./backend-django:/app
    environment:
      # Tell Django how to connect to the Postgres container
      - DATABASE_URL=postgres://admin:adminpassword@postgres:5432/workspace_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  # ----------------------------------------
  # FastAPI: ML & AI Engine
  # ----------------------------------------
  ml-service:
    build:
      context: ./ml-fastapi
    container_name: workspace_fastapi
    ports:
      - "8001:8001"
    volumes:
      - ./ml-fastapi:/app
    environment:
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis

  # ----------------------------------------
  # React: Frontend UI
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend-react
    container_name: workspace_react
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-react:/app
      # Prevents your local node_modules from overriding the container's
      - /app/node_modules 
    depends_on:
      - backend
      - ml-service

# Define persistent storage so you don't lose data when shutting down containers
volumes:
  postgres_data:
  rabbitmq_data:
  